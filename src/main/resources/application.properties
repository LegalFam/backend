spring.application.name=backend

# Import the env
spring.config.import=optional:file:.env[.properties]

# Connection to Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP (IMPORTANT for Supabase)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
# If you still get errors, switch to:
# spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100MB}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.admin.emails=${ADMIN_EMAILS:}

# Gemini (File Search)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.file-search-store-name=${GEMINI_FILE_SEARCH_STORE_NAME:}
app.gemini.file-search-store-names=${GEMINI_FILE_SEARCH_STORE_NAMES:${app.gemini.file-search-store-name:}}
app.gemini.upload-store-name=${GEMINI_UPLOAD_STORE_NAME:${app.gemini.file-search-store-name:}}
app.gemini.upload-poll-attempts=${GEMINI_UPLOAD_POLL_ATTEMPTS:12}
app.gemini.upload-poll-delay-ms=${GEMINI_UPLOAD_POLL_DELAY_MS:2000}
