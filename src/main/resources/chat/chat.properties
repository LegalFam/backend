# Chat module
app.n8n.timeout-ms=300000

# Chat SSE
app.chat.sse.emitter-timeout-ms=1800000
app.chat.sse.heartbeat-interval-ms=15000

# Chat messaging (EDA)
app.chat.messaging.rabbit.enabled=${CHAT_RABBIT_ENABLED:true}
app.chat.messaging.rabbit.exchange=chat.events.x
app.chat.messaging.rabbit.routing-key.assistant-delivery=chat.assistant.delivery.v1
app.chat.messaging.rabbit.queue.assistant-delivery=chat.assistant.delivery.q
app.chat.messaging.rabbit.exchange.dlx=chat.events.dlx
app.chat.messaging.rabbit.routing-key.dlq=chat.assistant.delivery.dlq
app.chat.messaging.rabbit.queue.dlq=chat.assistant.delivery.dlq
app.chat.messaging.rabbit.queue.ttl-ms=10800000
app.chat.messaging.rabbit.listener.concurrency=1
app.chat.messaging.rabbit.publisher.confirm-timeout-ms=5000
app.chat.messaging.rabbit.exchange-name=${app.chat.messaging.rabbit.exchange:chat.events.x}
app.chat.messaging.rabbit.dead-letter-exchange-name=${app.chat.messaging.rabbit.exchange.dlx:chat.events.dlx}
app.chat.messaging.rabbit.assistant-delivery-queue-name=${app.chat.messaging.rabbit.queue.assistant-delivery:chat.assistant.delivery.q}
app.chat.messaging.rabbit.dead-letter-queue-name=${app.chat.messaging.rabbit.queue.dlq:chat.assistant.delivery.dlq}
app.chat.messaging.rabbit.assistant-delivery-routing-key=${app.chat.messaging.rabbit.routing-key.assistant-delivery:chat.assistant.delivery.v1}
app.chat.messaging.rabbit.dead-letter-routing-key=${app.chat.messaging.rabbit.routing-key.dlq:chat.assistant.delivery.dlq}
app.chat.messaging.rabbit.publisher-confirm-timeout-ms=${app.chat.messaging.rabbit.publisher.confirm-timeout-ms:5000}
app.chat.messaging.rabbit.queue-ttl-ms=${app.chat.messaging.rabbit.queue.ttl-ms:10800000}

# Chat outbox
app.chat.outbox.relay.enabled=true
app.chat.outbox.relay.fixed-delay-ms=5000
app.chat.outbox.relay.retry-delay-ms=600000
app.chat.outbox.relay.batch-size=50
app.chat.outbox.cleanup.enabled=true
app.chat.outbox.cleanup.cron=0 0 * * * *
