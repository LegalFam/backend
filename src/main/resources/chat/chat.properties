# Chat module
app.n8n.timeout-ms=30000

# Chat SSE
app.chat.sse.emitter-timeout-ms=1800000
app.chat.sse.heartbeat-interval-ms=15000

# Chat messaging (EDA)
app.chat.messaging.rabbit.enabled=${CHAT_RABBIT_ENABLED:true}
app.chat.messaging.rabbit.exchange=chat.events.x
app.chat.messaging.rabbit.routing-key.chat-message-queued=chat.message.queued.v1
app.chat.messaging.rabbit.queue.chat-message-queued=chat.message.queued.q
app.chat.messaging.rabbit.exchange.dlx=chat.events.dlx
app.chat.messaging.rabbit.routing-key.dlq=chat.message.queued.dlq
app.chat.messaging.rabbit.queue.dlq=chat.message.queued.dlq
