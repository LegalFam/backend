# Auth module

# Transactional mail. When disabled the logging adapter prints the action URL
# instead of contacting SMTP, so the app and the tests run without a mail server.
app.auth.mail.enabled=${AUTH_MAIL_ENABLED:true}
app.auth.mail.from=${AUTH_MAIL_FROM:no-reply@legalfam.pe}
app.auth.mail.from-name=${AUTH_MAIL_FROM_NAME:LegalFam}
app.auth.mail.reply-to=${AUTH_MAIL_REPLY_TO:}

# Frontend links embedded in the emails. The paths must match the SPA routes.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.frontend.verify-email-path=/verificar-correo
app.frontend.reset-password-path=/restablecer-contrasena

# One-time token TTLs: 24h to verify an email, 1h to reset a password.
app.auth.tokens.email-verification-expiration-ms=86400000
app.auth.tokens.password-reset-expiration-ms=3600000
app.auth.tokens.mail-resend-cooldown-ms=60000
